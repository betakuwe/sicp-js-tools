name: JS Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # Adjust Node.js version if needed

      - name: Install ESLint globally
        run: npm install -g eslint

      - name: Create ESLint config as CommonJS
        run: |
          echo "module.exports = [{ files: ['**/*.js'], languageOptions: { ecmaVersion: 2021 }, }];" > eslint.config.cjs

      - name: Run ESLint on all JS files
        run: eslint '**/*.js' --config eslint.config.cjs
